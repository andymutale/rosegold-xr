<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131c" />
    <title>Room Pac-Man</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131c;
        color: #f6f7fb;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { position: relative; background: #10131c; touch-action: manipulation; }
      canvas { position: fixed; inset: 0; z-index: 0; }

      #game-ui {
        position: fixed;
        z-index: 2;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        max-width: min(340px, calc(100vw - 24px));
        padding: 12px 14px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 14px;
        background: rgb(12 15 24 / 82%);
        backdrop-filter: blur(10px);
        font-size: 14px;
        line-height: 1.4;
      }

      #game-ui h1 { margin: 0 0 6px; font-size: 16px; }
      #game-ui p { margin: 4px 0; }
      #status { color: #a9f5cf; }
      #room-scan { color: #8ddfff; font-size: 12px; }
      #hud-message { color: #c7d0e6; }
      #reset-button, #enter-ar-button {
        margin-top: 8px;
        padding: 8px 12px;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 8px;
        color: inherit;
        background: #27324a;
        font: inherit;
        cursor: pointer;
      }

      #reset-button:focus-visible, #enter-ar-button:focus-visible { outline: 2px solid #00ff88; outline-offset: 3px; }
      #enter-ar-button { margin-right: 6px; background: #155e75; }
      #enter-ar-button:disabled { cursor: not-allowed; opacity: 0.55; }
      .help { opacity: 0.75; font-size: 12px; }

      .webxr-button { z-index: 3 !important; }

      @media (max-width: 480px) {
        #game-ui { font-size: 12px; padding: 10px 12px; }
        #game-ui h1 { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <main id="game-ui" aria-label="Game controls and status">
      <h1>Room Pac-Man</h1>
      <p id="status" role="status" aria-live="polite">Starting game…</p>
      <p id="room-scan" aria-live="polite">Room scan: inactive until AR starts.</p>
      <p>Score: <span id="hud-score">0</span></p>
      <p>Lives: <span id="hud-lives">3</span></p>
      <p>Pellets: <span id="hud-pellets">0</span></p>
      <p id="hud-message" aria-live="polite">Collect pellets and avoid the ghost.</p>
      <p class="help">Move with arrow keys, WASD, or swipe. In AR, move the phone slowly to scan the floor, then tap to fit the maze.</p>
      <button id="enter-ar-button" type="button" aria-label="Enter augmented reality" disabled>Checking AR…</button>
      <button id="reset-button" type="button" aria-label="Reset the game">Reset game</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
