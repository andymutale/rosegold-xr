<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1115" />
    <meta name="description" content="Rosegold XR — a tabletop-inspired Pac-Man maze built with Three.js and browser-based augmented reality." />
    <title>Rosegold XR — Tabletop Maze</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #eef5f6;
        background: #0b1115;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --panel: rgba(9, 17, 21, 0.86);
        --line: rgba(194, 222, 226, 0.16);
        --muted: #8fa5aa;
        --cyan: #10a9ed;
        --gold: #ffcb35;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { position: relative; min-height: 100%; background: #0b1115; touch-action: manipulation; }
      canvas { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }
      button { font: inherit; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

      #game-ui {
        position: fixed;
        z-index: 2;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        width: min(374px, calc(100vw - 24px));
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 18px 56px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px) saturate(125%);
        -webkit-backdrop-filter: blur(16px) saturate(125%);
      }

      .brand-row { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; }
      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        place-items: center;
        border: 1px solid rgba(16, 169, 237, 0.5);
        border-radius: 11px;
        color: #bcecff;
        background: linear-gradient(145deg, rgba(16, 169, 237, 0.23), rgba(18, 59, 70, 0.24));
        font-size: 13px;
        font-weight: 850;
        letter-spacing: -0.06em;
      }
      .brand-copy { min-width: 0; flex: 1; }
      .eyebrow { margin: 0 0 3px; color: #81a1aa; font-size: 9px; font-weight: 800; letter-spacing: 0.17em; }
      #game-ui h1 { margin: 0; font-size: 17px; font-weight: 760; letter-spacing: -0.045em; line-height: 1.1; }
      .mode-chip { padding: 6px 8px; border: 1px solid rgba(255, 203, 53, 0.25); border-radius: 999px; color: var(--gold); background: rgba(255, 203, 53, 0.07); font-size: 9px; font-weight: 800; letter-spacing: 0.1em; }

      #status {
        position: relative;
        margin: 0 0 6px;
        padding-left: 13px;
        color: #dff8e9;
        font-size: 12px;
        line-height: 1.45;
      }
      #status::before { content: ""; position: absolute; top: 5px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: #6fe3a4; box-shadow: 0 0 10px rgba(111, 227, 164, 0.42); }
      #room-scan { margin: 0; color: #80cde7; font-size: 10px; line-height: 1.4; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 13px 0 10px; }
      .stat {
        min-width: 0;
        padding: 9px 10px;
        border: 1px solid rgba(198, 224, 230, 0.11);
        border-radius: 11px;
        background: rgba(235, 250, 255, 0.035);
      }
      .stat-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; }
      .stat-value { display: block; overflow: hidden; color: #f4f8f8; font-size: 20px; font-weight: 760; line-height: 1; text-overflow: ellipsis; }
      #hud-score { color: var(--gold); }
      #hud-message { margin: 0 0 11px; color: #a9babe; font-size: 11px; line-height: 1.4; }
      .actions { display: flex; gap: 8px; }
      #enter-ar-button, #reset-button {
        min-height: 39px;
        padding: 0 12px;
        border: 1px solid rgba(210, 237, 242, 0.18);
        border-radius: 10px;
        color: #edf7f8;
        background: rgba(212, 242, 248, 0.075);
        font-size: 11px;
        font-weight: 750;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
      }
      #enter-ar-button { flex: 1; border-color: rgba(16, 169, 237, 0.56); background: linear-gradient(120deg, rgba(8, 111, 151, 0.9), rgba(7, 68, 87, 0.9)); }
      #enter-ar-button:not(:disabled):active, #reset-button:active, .direction:active { transform: translateY(1px) scale(0.98); }
      #enter-ar-button:disabled { opacity: 0.48; cursor: not-allowed; }
      #reset-button { flex: 0 0 auto; }
      .help { margin: 10px 1px 0; color: #778e94; font-size: 10px; line-height: 1.45; }

      #direction-pad {
        position: fixed;
        z-index: 2;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(3, 48px);
        gap: 5px;
        padding: 8px;
        border: 1px solid rgba(191, 222, 228, 0.15);
        border-radius: 19px;
        background: rgba(8, 15, 19, 0.61);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        user-select: none;
        touch-action: none;
      }
      .direction {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid rgba(190, 226, 233, 0.16);
        border-radius: 12px;
        color: #e5f5f8;
        background: rgba(220, 246, 250, 0.07);
        font-size: 21px;
        cursor: pointer;
        touch-action: none;
      }
      .direction[data-direction="up"] { grid-column: 2; grid-row: 1; }
      .direction[data-direction="left"] { grid-column: 1; grid-row: 2; }
      .direction[data-direction="right"] { grid-column: 3; grid-row: 2; }
      .direction[data-direction="down"] { grid-column: 2; grid-row: 3; }
      .pad-center { grid-column: 2; grid-row: 2; display: grid; place-items: center; border: 1px solid rgba(16, 169, 237, 0.22); border-radius: 12px; color: var(--cyan); background: rgba(16, 169, 237, 0.08); font-size: 9px; font-weight: 850; }
      .webxr-button { z-index: 3 !important; }

      @media (min-width: 760px) {
        #game-ui { top: 18px; left: 18px; padding: 17px; }
        #direction-pad { right: 22px; bottom: 22px; }
      }
      @media (max-width: 480px) {
        #game-ui { top: max(9px, env(safe-area-inset-top)); left: max(9px, env(safe-area-inset-left)); width: min(355px, calc(100vw - 18px)); padding: 12px; border-radius: 15px; }
        .brand-row { gap: 9px; margin-bottom: 10px; }
        .brand-mark { width: 34px; height: 34px; flex-basis: 34px; border-radius: 10px; }
        #game-ui h1 { font-size: 15px; }
        .stat { padding: 8px; }
        .stat-value { font-size: 18px; }
        .stats { margin-top: 10px; }
        #direction-pad { right: max(10px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); grid-template-columns: repeat(3, 43px); grid-template-rows: repeat(3, 43px); gap: 4px; padding: 6px; }
        .direction { width: 43px; height: 43px; border-radius: 11px; }
        .pad-center { border-radius: 11px; }
      }
      @media (max-height: 560px) and (orientation: landscape) {
        #game-ui { top: 8px; left: 8px; width: 300px; padding: 10px; }
        .brand-row { margin-bottom: 7px; }
        .stats { margin: 7px 0; }
        .stat { padding: 6px 8px; }
        .stat-value { font-size: 16px; }
        .help { margin-top: 6px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main id="game-ui" aria-label="Rosegold XR game status and controls">
      <header class="brand-row">
        <div class="brand-mark" aria-hidden="true">RG</div>
        <div class="brand-copy">
          <p class="eyebrow">ROSEGOLD XR · EXPERIMENT 01</p>
          <h1>Tabletop Maze</h1>
        </div>
        <span class="mode-chip">3D / AR</span>
      </header>

      <p id="status" role="status" aria-live="polite">Starting game…</p>
      <p id="room-scan" aria-live="polite">Surface scan: inactive until AR starts.</p>

      <section class="stats" aria-label="Current game stats">
        <div class="stat"><span class="stat-label">Score</span><strong class="stat-value" id="hud-score">0</strong></div>
        <div class="stat"><span class="stat-label">Lives</span><strong class="stat-value" id="hud-lives">3</strong></div>
        <div class="stat"><span class="stat-label">Pellets</span><strong class="stat-value" id="hud-pellets">0</strong></div>
      </section>

      <p id="hud-message" aria-live="polite">Collect the gold tiles. Keep moving.</p>
      <div class="actions">
        <button id="enter-ar-button" type="button" aria-label="Enter augmented reality" disabled>Checking AR…</button>
        <button id="reset-button" type="button" aria-label="Reset game">Reset</button>
      </div>
      <p class="help">In AR, point at a flat tabletop and tap when the cyan ring appears. On a computer, use WASD or the arrow keys.</p>
    </main>

    <nav id="direction-pad" aria-label="Touch movement controls">
      <button class="direction" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="direction" type="button" data-direction="left" aria-label="Move left">←</button>
      <span class="pad-center" aria-hidden="true">MOVE</span>
      <button class="direction" type="button" data-direction="right" aria-label="Move right">→</button>
      <button class="direction" type="button" data-direction="down" aria-label="Move down">↓</button>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
